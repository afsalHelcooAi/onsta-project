version: '3.8'

services:
  api:
    build: .
    container_name: onsta_clinic_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/onsta_clinic_db
      - REDIS_URL=redis://redis:6379/0
      - AWS_REGION=me-central-1
      - S3_BUCKET_NAME=onsta-clinic-regulatory-docs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-""}
      - AI_MODEL_NAME=gemini-2.0-flash
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: onsta_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onsta_clinic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: onsta_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
